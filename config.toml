baseurl = "https://vabs.github.io/"
title = "Vaibhav Somani"
locale = "en-US"
enableEmoji = true
metaDataFormat = "yaml"
paginate = 10
paginatePath = "page"

[services]
  [services.disqus]
    shortname = "vabs-github-io"
  [services.googleAnalytics]
    id = "UA-42522319-5"

[Author]
    name = "Vaibhav Somani"

[Taxonomies]
    tag = "tags"

[Params]
    description = "Software engineer building things on the internet."
    github = "https://github.com/vabs"
    authorName = "Vaibhav Somani"

[markup]
  [markup.highlight]
    style = "monokai"
    codeFences = true
    guessSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[Permalinks]
    post = "/:year/:month/:day/:contentbasename/"