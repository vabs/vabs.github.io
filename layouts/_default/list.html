{{ define "main" }}
<section class="list-page">
  <header class="list-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>
  <ul class="post-list">
    {{ range .Pages }}
    <li class="post-item">
      <a class="post-link" href="{{ .Permalink }}">{{ .Title }}</a>
      {{ if not .Date.IsZero }}
      <span class="post-date">{{ .Date.Format "Jan 2006" }}</span>
      {{ end }}
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
