<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="/images/favicon.ico">
  {{ template "_internal/google_analytics.html" . }}
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-logo" href="/">{{ .Site.Params.authorName }}</a>
      <div class="nav-links">
        <a href="/#projects">Projects</a>
        <a href="/#blog">Blog</a>
        <a href="/page/about/">About</a>
        <a href="/page/contact/">Contact</a>
      </div>
      <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
    </nav>
    <div class="nav-mobile-menu">
      <a href="/#projects">Projects</a>
      <a href="/#blog">Blog</a>
      <a href="/page/about/">About</a>
      <a href="/page/contact/">Contact</a>
    </div>
  </header>

  <main class="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>{{ .Site.Params.authorName }}</span>
      <div class="footer-links">
        <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">GitHub</a>
        <a href="/page/contact/">Contact</a>
      </div>
      <span class="footer-copy">&copy; {{ now.Year }}</span>
    </div>
  </footer>

  <script>
    (function() {
      var toggle = document.querySelector('.nav-toggle');
      var menu = document.querySelector('.nav-mobile-menu');
      if (toggle && menu) {
        toggle.addEventListener('click', function() {
          menu.classList.toggle('open');
        });
      }
    })();
  </script>
</body>
</html>
